[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thebigdiffer"
version = "2.0.0"
description = "Autonomous, source-grounded software patch security investigation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "TheBigDiffer contributors" }]
keywords = ["security", "patch-analysis", "code-review", "aws-bedrock"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = [
  "boto3>=1.43,<2",
  "botocore[crt]>=1.43,<1.44",
]

[project.urls]
Repository = "https://github.com/dacman28/TheBigDiffer"

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.7"]

[project.scripts]
thebigdiffer = "thebigdiffer.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thebigdiffer = ["investigator/prompts/*.txt", "investigator/pricing/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
